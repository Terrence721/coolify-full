# Opt-in addition to the dev stack - NOT included in `spin up`/docker-compose.dev.yml's default
# services. Adds a single, genuinely isolated "remote server" (its own dockerd, not the host's
# bind-mounted socket) for the 4 smoke-test checklist items that need real destructive Docker/OS
# actions tested safely. See docker/smoketest-host/Dockerfile and docs/command.md for why this
# exists as a separate file rather than a permanent fixture like coolify-testing-host.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.smoketest.yml up -d --build smoketest-host
#   docker exec coolify php artisan db:seed --class=SmoketestHostSeeder --no-interaction

services:
  smoketest-host:
    image: coolify-smoketest-host:dev
    pull_policy: never
    build:
      context: .
      dockerfile: ./docker/smoketest-host/Dockerfile
    init: true
    container_name: coolify-smoketest-host
    restart: unless-stopped
    privileged: true
    volumes:
      - smoketest_docker_data:/var/lib/docker
    networks:
      - coolify

volumes:
  smoketest_docker_data:
