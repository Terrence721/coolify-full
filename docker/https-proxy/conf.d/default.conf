server {
    listen 443 ssl;
    server_name coolify-full.localhost;

    ssl_certificate     /etc/nginx/certs/dev.crt;
    ssl_certificate_key /etc/nginx/certs/dev.key;

    location / {
        proxy_pass http://coolify:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 8443;
        proxy_set_header X-Forwarded-Host $host:8443;

        # WebSocket upgrade support (Soketi/Echo)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Dedicated TLS-terminated port for Soketi/Echo's websocket connection. Pusher-js already
# refuses to open a plain ws:// connection from an HTTPS page (browsers block it as mixed
# content the same as an HTTP <script>), so it correctly requests wss:// on its own - but
# Soketi itself only speaks plain ws on port 6001, and that host port is already taken by the
# real coolify-realtime container, so a separate port is needed here rather than reusing 6001.
server {
    listen 6443 ssl;
    server_name coolify-full.localhost;

    ssl_certificate     /etc/nginx/certs/dev.crt;
    ssl_certificate_key /etc/nginx/certs/dev.key;

    location / {
        proxy_pass http://coolify-realtime:6001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
